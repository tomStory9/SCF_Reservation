grumphp:
  process_timeout: 5000000
  fixer:
    enabled: true
    fix_by_default: true

  tasks:
    phplint:
      triggered_by: ['php']

    phpcsfixer:
      config: '.php-cs-fixer.dist.php'
      triggered_by: ['php']
    eslint:
            bin: node_modules/.bin/eslint
            triggered_by: [js, jsx, ts, tsx, vue]
            whitelist_patterns:
                - /^assets\/js\/(.*)/
            no_eslintrc: false
            quiet: false
